name: Build and Release AssetRipper DzGreen

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x
  GUI_PROJECT: Source/AssetRipper.GUI.Free/AssetRipper.GUI.Free.csproj
  CLI_PROJECT: Source/AssetRipper.Tools.CLI/AssetRipper.Tools.CLI.csproj
  MCP_PROJECT: Source/AssetRipper.Tools.MCP/AssetRipper.Tools.MCP.csproj

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, runtime: win-x64, archive: zip }
          - { name: windows-arm64, os: windows-11-arm, runtime: win-arm64, archive: zip }
          - { name: linux-x64, os: ubuntu-22.04, runtime: linux-x64, archive: tar.xz }
          - { name: linux-arm64, os: ubuntu-22.04-arm, runtime: linux-arm64, archive: tar.xz }
          - { name: macos-x64, os: macos-15-intel, runtime: osx-x64, archive: tar.xz }
          - { name: macos-arm64, os: macos-14, runtime: osx-arm64, archive: tar.xz }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AssetRipper.slnx --locked-mode

      - name: Publish GUI
        run: dotnet publish ${{ env.GUI_PROJECT }} -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishAot=false --no-restore

      - name: Publish CLI
        run: dotnet publish ${{ env.CLI_PROJECT }} -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishAot=false --no-restore

      - name: Publish MCP
        run: dotnet publish ${{ env.MCP_PROJECT }} -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishAot=false --no-restore

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package release-assets
          mkdir -p package/GUI package/tools/CLI package/tools/MCP release-assets
          cp -R "Source/0Bins/AssetRipper.GUI.Free/Release/${{ matrix.runtime }}/publish/." package/GUI/
          cp -R "Source/0Bins/AssetRipper.Tools.CLI/Release/${{ matrix.runtime }}/publish/." package/tools/CLI/
          cp -R "Source/0Bins/AssetRipper.Tools.MCP/Release/${{ matrix.runtime }}/publish/." package/tools/MCP/
          printf 'AssetRipper DzGreen\nRuntime: ${{ matrix.runtime }}\nCommit: %s\n' "$GITHUB_SHA" > package/BUILD_INFO.txt
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a -tzip "release-assets/AssetRipper-DzGreen-${{ matrix.name }}.zip" ./package/* >/dev/null
          else
            tar -cJf "release-assets/AssetRipper-DzGreen-${{ matrix.name }}.tar.xz" -C package .
          fi
          if command -v sha256sum >/dev/null 2>&1; then sha256sum release-assets/* > release-assets/SHA256SUMS-${{ matrix.name }}.txt; else shasum -a 256 release-assets/* > release-assets/SHA256SUMS-${{ matrix.name }}.txt; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetRipper-DzGreen-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: AssetRipper-DzGreen-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          body: |
            AssetRipper DzGreen release maintained by dzgreen.

            This is an advanced fork of the official AssetRipper project. Upstream attribution and the GPL-3.0 license are retained. See `NOTICE.md` for fork scope and legal notices.

            Support independent maintenance at https://ko-fi.com/dzgreen.
